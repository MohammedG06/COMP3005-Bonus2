[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbms"
version = "0.1.0"
description = "COMP 3005 Project 2"
requires-python = ">=3.9"

[project.scripts]
storage = "dbms.storage.cli:main"
exec = "dbms.execution.cli:main"
sql = "dbms.sql.cli:main"
opt = "dbms.optimizer.cli:main"

[tool.setuptools.packages.find]
include = ["dbms*"]
